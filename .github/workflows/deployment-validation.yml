name: Deployment Validation

# WORK-042 AC7: CI validates the deployment configuration, runs the
# deterministic smoke checks, and produces an auditable deployment
# identity for the EXACT Git revision of the checkout. This workflow
# is additive: it does not alter or weaken the repository governance
# workflow (.github/workflows/governance.yml).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deployment-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZECK_ENVIRONMENT: local
      ZECK_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      ZECK_LOCAL_REDIS_URL: redis://localhost:6379
      ZECK_LOCAL_DATA_ROOT: /tmp/zeck-ci-local
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate deployment configuration (manifests, naming, ports, secret scan)
        run: bun run deploy:validate
      - name: Bootstrap local environment (first convergence)
        run: bun run deploy:bootstrap -- --environment local
      - name: Bootstrap local environment (idempotent re-convergence)
        run: |
          bun run deploy:bootstrap -- --environment local > /tmp/bootstrap-2.json
          # The second run must report the database as already converged.
          grep -q "already-present (converged)" /tmp/bootstrap-2.json
      - name: "Smoke: readiness + exact-revision deployment identity"
        run: bun run deploy:smoke -- --environment local
      - name: Emit deployment identity (deterministic)
        run: |
          bun run deploy:identity -- --environment local > deployment-identity.json
          bun run deploy:identity -- --environment local > deployment-identity-2.json
          # The identity is pure: two runs at the same revision are identical.
          diff deployment-identity.json deployment-identity-2.json
          cat deployment-identity.json >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat deployment-identity.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload deployment identity artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-identity-${{ github.sha }}
          path: deployment-identity.json
