name: Architecture Change Request
description: Propose an evolution that cannot safely fit within the frozen architecture.
title: "ACR-___ — "
labels: [architecture]
body:
  - type: markdown
    attributes:
      value: |
        Frozen architecture is append-only. Do not rewrite `spec/architecture.md` or `spec/architecture-lock.md` in place.
  - type: input
    id: current-version
    attributes:
      label: Current ArchitectureVersion
      placeholder: v1.0
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation and evidence
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed evolution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered and rejected
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Preserved invariants and authority impact
    validations:
      required: true
  - type: textarea
    id: migration
    attributes:
      label: Migration and rollback strategy
    validations:
      required: true
